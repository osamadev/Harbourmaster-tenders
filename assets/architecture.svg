<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="Harbourmaster architecture">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1f3a"/>
      <stop offset="100%" stop-color="#122a4a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <style>
      .title { font: 700 28px Segoe UI, Arial, sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 14px Segoe UI, Arial, sans-serif; fill: #94a3b8; }
      .label { font: 600 13px Segoe UI, Arial, sans-serif; fill: #f8fafc; }
      .small { font: 400 11px Segoe UI, Arial, sans-serif; fill: #cbd5e1; }
      .box { rx: 12; filter: url(#shadow); }
      .arrow { stroke: #14b8a6; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#14b8a6"/>
    </marker>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>
  <text x="40" y="42" class="title">Harbourmaster — system architecture</text>
  <text x="40" y="68" class="subtitle">Governed multi-agent tender review with Phoenix observability and Elastic memory</text>

  <!-- Streamlit UI -->
  <rect class="box" x="40" y="110" width="200" height="90" fill="#1e3a5f" stroke="#14b8a6"/>
  <text x="60" y="142" class="label">Streamlit UI</text>
  <text x="60" y="164" class="small">Reviewer workflow</text>
  <text x="60" y="182" class="small">Governance Copilot</text>

  <!-- Guard -->
  <rect class="box" x="300" y="110" width="180" height="90" fill="#7f1d1d" stroke="#f59e0b"/>
  <text x="320" y="142" class="label">Inline guard</text>
  <text x="320" y="164" class="small">ALLOW / HUMAN_REVIEW / DENY</text>

  <!-- LangGraph -->
  <rect class="box" x="540" y="90" width="260" height="130" fill="#312e81" stroke="#818cf8"/>
  <text x="560" y="122" class="label">LangGraph workflow</text>
  <text x="560" y="144" class="small">Segment → 5 specialists → aggregate</text>
  <text x="560" y="162" class="small">Verifier loop → HITL interrupt</text>
  <text x="560" y="180" class="small">Negotiate → draft summary</text>

  <!-- Gemini -->
  <rect class="box" x="860" y="110" width="160" height="90" fill="#14532d" stroke="#16a34a"/>
  <text x="880" y="142" class="label">Gemini API</text>
  <text x="880" y="164" class="small">OpenAI-compatible</text>

  <!-- Phoenix -->
  <rect class="box" x="300" y="280" width="220" height="100" fill="#134e4a" stroke="#14b8a6"/>
  <text x="320" y="312" class="label">Arize Phoenix</text>
  <text x="320" y="334" class="small">OpenInference traces</text>
  <text x="320" y="352" class="small">Datasets &amp; experiments</text>
  <text x="320" y="370" class="small">Phoenix MCP</text>

  <!-- Elastic -->
  <rect class="box" x="580" y="280" width="220" height="100" fill="#1e3a5f" stroke="#f59e0b"/>
  <text x="600" y="312" class="label">Elasticsearch</text>
  <text x="600" y="334" class="small">Policies &amp; precedents</text>
  <text x="600" y="352" class="small">Review artifacts</text>
  <text x="600" y="370" class="small">Elastic MCP</text>

  <!-- Human -->
  <rect class="box" x="860" y="280" width="180" height="100" fill="#4c1d95" stroke="#a78bfa"/>
  <text x="880" y="312" class="label">Human reviewer</text>
  <text x="880" y="334" class="small">Approve / reject</text>
  <text x="880" y="352" class="small">LangGraph resume</text>

  <!-- Docker band -->
  <rect x="40" y="430" width="1120" height="250" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="60" y="462" class="label">Docker Compose (default: COMPOSE_PROFILES=local)</text>

  <rect class="box" x="70" y="490" width="150" height="70" fill="#1e293b" stroke="#64748b"/>
  <text x="90" y="520" class="label">ui</text>
  <text x="90" y="542" class="small">:8501</text>

  <rect class="box" x="260" y="490" width="150" height="70" fill="#1e293b" stroke="#64748b"/>
  <text x="280" y="520" class="label">phoenix</text>
  <text x="280" y="542" class="small">:6006</text>

  <rect class="box" x="450" y="490" width="150" height="70" fill="#1e293b" stroke="#64748b"/>
  <text x="470" y="520" class="label">elastic</text>
  <text x="470" y="542" class="small">:9200</text>

  <text x="70" y="600" class="small">Server URLs inside Docker: phoenix:6006 · elastic:9200</text>
  <text x="70" y="622" class="small">Browser console URL: PHOENIX_CONSOLE_URL (host/VPS public address)</text>
  <text x="70" y="644" class="small">Cloud mode: UI-only stack + Phoenix Cloud + Elastic Cloud (.env.cloud)</text>

  <!-- Arrows -->
  <path class="arrow" d="M240 155 H300"/>
  <path class="arrow" d="M480 155 H540"/>
  <path class="arrow" d="M800 155 H860"/>
  <path class="arrow" d="M140 200 V250 H410 V280"/>
  <path class="arrow" d="M670 220 V280"/>
  <path class="arrow" d="M800 220 V310 H860"/>
  <path class="arrow" d="M520 330 H580"/>
</svg>

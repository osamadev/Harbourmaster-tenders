[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harbourmaster"
version = "0.1.0"
description = "Workflow governance control plane for agentic LLM tender review with Arize Phoenix observability"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "langgraph>=0.3.0",
    "openai>=1.40.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "pypdf>=4.0.0",
    "arize-phoenix-otel>=0.6.0",
    "arize-phoenix-client>=1.0.0",
    "openinference-instrumentation-openai>=0.1.0",
    "openinference-instrumentation-langchain>=0.1.0",
    "langchain-mcp-adapters>=0.0.12",
    "langchain-openai>=0.2.0",
    "elasticsearch>=8.15.0,<9",
]

[tool.setuptools]
packages = ["harbourmaster"]
